<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="ゆうちゃん10歳のお誕生日サプライズ">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ゆうちゃんへ 🎂</title>
<style>
:root{--bg:#000;--fg:#fff;--orange:#ff8c1a;--yellow:#fff200;--blue:#2d63ff;--red:#ff2b2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden}
body{font-family:"Courier New","MS Gothic","Noto Sans Mono CJK JP",monospace;image-rendering:pixelated;touch-action:manipulation}
button{font:inherit}
.screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.hidden{display:none!important}

/* START */
#start{z-index:50;text-align:center}
.start-card{width:min(92vw,680px)}
.start-title{font-size:clamp(28px,8vw,56px);font-weight:900;letter-spacing:.04em;margin:0 0 20px}
.start-copy{font-size:clamp(15px,4vw,22px);line-height:1.8;margin:0 0 26px;opacity:.94}
.pixel-btn{background:#000;color:#fff;border:4px solid #fff;padding:14px 28px;font-weight:900;cursor:pointer;box-shadow:6px 6px 0 #fff;min-width:170px}
.pixel-btn:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #fff}
.small{font-size:12px;opacity:.48;margin-top:24px;line-height:1.6}
.music-toggle{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:90;background:#000;color:#fff;border:2px solid #fff;padding:7px 10px;font-size:12px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #fff}
.music-toggle:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #fff}

/* MAIN GAME */
#game{z-index:20;align-items:stretch;justify-content:center}
.game-shell{width:min(100%,1120px);height:min(100%,900px);margin:auto;display:grid;grid-template-rows:minmax(210px,1.2fr) 6px minmax(155px,29vh) auto auto;gap:8px}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:visible;min-height:180px;padding-top:10px;padding-bottom:6px}
.sans-wrap{position:relative;width:clamp(170px,36vw,260px);aspect-ratio:255/205;display:block;flex:0 0 auto}
.sans{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}
.eye-glow{position:absolute;width:6.6%;aspect-ratio:1;border-radius:45%;left:44.75%;top:24.0%;background:#3a68ff;opacity:0;filter:drop-shadow(0 0 3px #3a68ff) drop-shadow(0 0 8px #3a68ff) drop-shadow(0 0 15px #3a68ff);transition:opacity .08s}
.eye-glow.on{opacity:1}
.divider{height:6px;background:#fff}
.dialogue{position:relative;border:6px solid #fff;background:#000;padding:18px 24px 30px;overflow:hidden;cursor:pointer;min-height:0}
#dialogueText{font-size:clamp(22px,4.5vw,38px);font-weight:800;line-height:1.48;letter-spacing:.02em;white-space:pre-wrap}
.next{position:absolute;right:18px;bottom:8px;font-size:18px;opacity:0}
.next.show{opacity:1;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:.18}}
.status{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,42px);font-size:clamp(19px,3.2vw,31px);font-weight:900;padding:0 4px;white-space:nowrap}
.hp{display:flex;align-items:center;gap:8px}
.hpbar{width:clamp(42px,8vw,70px);height:clamp(22px,3.5vw,34px);background:var(--yellow)}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2vw,18px)}
.menu div{border:4px solid var(--orange);color:var(--orange);text-align:center;padding:8px 4px;font-size:clamp(16px,2.8vw,30px);font-weight:900;white-space:nowrap}
.hint{position:absolute;right:8px;top:6px;font-size:11px;opacity:.35}

/* FINAL BATTLE */
#battle{z-index:40;background:#000;flex-direction:column;gap:20px;text-align:center}
.battle-box{position:relative;width:min(84vw,720px);height:min(42vh,360px);border:6px solid #fff;overflow:hidden;background:#000}
.soul{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--blue);font-size:clamp(42px,9vw,72px);text-shadow:0 0 8px var(--blue);z-index:3}
.bone{position:absolute;background:#fff;border-radius:8px;box-shadow:0 0 0 2px #fff}
.bone::before,.bone::after{content:"";position:absolute;background:#fff;border-radius:50%}
.bone.v{width:11px;height:38%;top:31%}
.bone.v::before,.bone.v::after{width:18px;height:18px;left:50%;transform:translateX(-50%)}
.bone.v::before{top:-7px} .bone.v::after{bottom:-7px}
.bone.left{left:-30px;animation:leftBone 1.8s cubic-bezier(.2,.7,.2,1) forwards}
.bone.right{right:-30px;animation:rightBone 1.8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes leftBone{to{left:22%}}
@keyframes rightBone{to{right:22%}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0} 20%{opacity:1} 100%{opacity:0}}

/* FINAL CARD */
#finale{z-index:60;text-align:center;flex-direction:column;gap:16px}
.final-heart{font-size:clamp(50px,13vw,100px);color:var(--red);animation:beat .7s infinite alternate}
@keyframes beat{to{transform:scale(1.16)}}
.final-title{font-size:clamp(30px,8vw,70px);font-weight:900;line-height:1.2;letter-spacing:.03em;white-space:pre-line}
.final-message{font-size:clamp(17px,4vw,28px);line-height:1.65;font-weight:700;white-space:pre-line}
.final-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.final-actions .pixel-btn{min-width:150px}
.continue-panel{margin-top:8px;border:4px solid #fff;padding:14px 18px;font-size:clamp(16px,3.6vw,24px);line-height:1.6;max-width:720px;display:none}
.continue-panel.show{display:block;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

/* Phones / short screens */
@media (max-width:640px){
  .game-shell{grid-template-rows:minmax(120px,1fr) 5px minmax(210px,34vh) auto auto;gap:6px}
  .sans-wrap{width:clamp(175px,58vw,260px)}
  .dialogue{border-width:5px;padding:15px 16px 28px}
  #dialogueText{font-size:clamp(21px,6.1vw,30px);line-height:1.42}
  .status{justify-content:space-between;font-size:20px;gap:8px}
  .menu{gap:6px}
  .menu div{font-size:clamp(14px,4vw,20px);padding:8px 2px;border-width:3px}
}
@media (max-height:650px) and (orientation:landscape){
  .game-shell{grid-template-rows:minmax(95px,1fr) 4px minmax(145px,38vh) auto auto;gap:4px}
  .sans-wrap{width:clamp(150px,22vw,220px)}
  .dialogue{padding:10px 18px 22px;border-width:4px}
  #dialogueText{font-size:clamp(18px,2.7vw,25px);line-height:1.3}
  .status{font-size:17px}
  .menu div{font-size:16px;padding:5px 2px;border-width:3px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<script>
const dialoguePages = [
  {text:"＊ よう、ゆうちゃん。", after:520},
  {text:"＊ きょうは なんのひかって？", after:760},
  {text:"＊ ……へへっ。", after:930},
  {text:"＊ わすれるわけ ないだろ？", after:820},
  {text:"＊ ゆうちゃん", after:480},
  {text:"＊ 10さいの おたんじょうび", after:620},
  {text:"＊ おめでとう！", after:980, eye:true, fanfare:true},
  {text:"＊ マイクラも ゲームも\n＊ これからも おもいっきり\n＊ たのしんでくれよ。", after:780},
  {text:"＊ それから――", after:820},
  {text:"＊ おとうさんたちは\n＊ いつだって ゆうちゃんの みかただぜ。", after:1000},
  {text:"＊ さいこうの 10さいに\n＊ しようぜ。", after:900, eye:true}
];

const els={
  start:document.getElementById('start'),
  game:document.getElementById('game'),
  battle:document.getElementById('battle'),
  finale:document.getElementById('finale'),
  startBtn:document.getElementById('startBtn'),
  replayBtn:document.getElementById('replayBtn'),
  continueBtn:document.getElementById('continueBtn'),
  continuePanel:document.getElementById('continuePanel'),
  musicBtn:document.getElementById('musicBtn'),
  text:document.getElementById('dialogueText'),
  next:document.getElementById('next'),
  eye:document.getElementById('eyeGlow'),
  dialogue:document.getElementById('dialogue'),
  stage:document.getElementById('stage'),
  flash:document.getElementById('flash')
};

let idx=0,typing=false,skip=false,started=false,waiting=false,ended=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function audioCtx(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!window.__ac)window.__ac=new AC();
    return window.__ac;
  }catch(e){return null}
}

function blip(freq=360,dur=.022,vol=.016){
  try{
    const ac=audioCtx(); if(!ac)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(ac.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
    o.stop(ac.currentTime+dur);
  }catch(e){}
}

function chord(){
  [520,660,830].forEach((f,i)=>setTimeout(()=>blip(f,.11,.025),i*90));
}

function eye(ms=900){
  els.eye.classList.add('on');
  setTimeout(()=>els.eye.classList.remove('on'),ms);
}

/* ---------- Original retro-RPG 8bit BGM ---------- */
const bgm={
  playing:false,
  muted:false,
  step:0,
  nextTime:0,
  timer:null,
  gain:null
};

const BPM=112;
const STEP=60/BPM/2; // eighth note

// Original 32-step melody; intentionally not copied from any game soundtrack.
const leadSeq=[
  69,null,72,76,74,null,72,71,
  69,null,76,79,77,76,72,null,
  67,null,71,74,72,null,71,69,
  65,69,72,76,74,72,71,null
];
const bassRoots=[45,45,41,43,45,40,41,43];
const arpChords=[
  [57,60,64],[57,60,64],[53,57,60],[55,59,62],
  [57,60,64],[52,56,59],[53,57,60],[55,59,62]
];

function midiToFreq(n){return 440*Math.pow(2,(n-69)/12)}

function synthNote(freq,start,dur,type,vol,destination){
  try{
    const ac=audioCtx(); if(!ac||!destination)return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,start);
    g.gain.setValueAtTime(.0001,start);
    g.gain.exponentialRampToValueAtTime(vol,start+.008);
    g.gain.exponentialRampToValueAtTime(.0001,start+dur);
    o.connect(g);g.connect(destination);
    o.start(start);o.stop(start+dur+.02);
  }catch(e){}
}

function ensureBgmGain(){
  const ac=audioCtx(); if(!ac)return null;
  if(!bgm.gain){
    bgm.gain=ac.createGain();
    bgm.gain.gain.value=bgm.muted?0:.72;
    bgm.gain.connect(ac.destination);
  }
  return bgm.gain;
}

function scheduleBgmStep(stepIndex,time){
  const dest=ensureBgmGain(); if(!dest)return;
  const pos=stepIndex%32;
  const bar=Math.floor(pos/4)%8;

  // Lead channel
  const lead=leadSeq[pos];
  if(lead!==null)synthNote(midiToFreq(lead),time,STEP*.72,'square',.038,dest);

  // Soft arpeggio channel
  const chordNotes=arpChords[bar];
  const arpNote=chordNotes[pos%3]+12;
  synthNote(midiToFreq(arpNote),time,STEP*.42,'square',.010,dest);

  // Bass channel on quarter-note pulses
  if(pos%2===0){
    const bass=bassRoots[Math.floor(pos/4)%8];
    synthNote(midiToFreq(bass),time,STEP*1.65,'triangle',.050,dest);
  }

  // Tiny pulse percussion
  if(pos%4===2)synthNote(92,time,.045,'square',.012,dest);
}

function bgmScheduler(){
  const ac=audioCtx(); if(!ac||!bgm.playing)return;
  while(bgm.nextTime<ac.currentTime+.14){
    scheduleBgmStep(bgm.step,bgm.nextTime);
    bgm.nextTime+=STEP;
    bgm.step++;
  }
}

async function startBgm(){
  const ac=audioCtx(); if(!ac)return;
  try{if(ac.state==='suspended')await ac.resume()}catch(e){}
  ensureBgmGain();
  if(bgm.playing)return;
  bgm.playing=true;
  bgm.step=0;
  bgm.nextTime=ac.currentTime+.05;
  bgmScheduler();
  bgm.timer=setInterval(bgmScheduler,25);
}

function setBgmLevel(value,seconds=.12){
  try{
    const ac=audioCtx(); if(!ac||!bgm.gain)return;
    const now=ac.currentTime;
    bgm.gain.gain.cancelScheduledValues(now);
    bgm.gain.gain.setValueAtTime(Math.max(.0001,bgm.gain.gain.value),now);
    bgm.gain.gain.exponentialRampToValueAtTime(Math.max(.0001,value),now+seconds);
  }catch(e){}
}

function stopBgm(fade=.25){
  if(!bgm.playing)return;
  setBgmLevel(.0001,fade);
  bgm.playing=false;
  if(bgm.timer){clearInterval(bgm.timer);bgm.timer=null}
}

function updateMusicButton(){
  els.musicBtn.textContent=bgm.muted?'♪ BGM OFF':'♪ BGM ON';
}

function toggleBgm(){
  bgm.muted=!bgm.muted;
  updateMusicButton();
  if(bgm.gain)setBgmLevel(bgm.muted?.0001:.72,.12);
}

function finaleJingle(){
  const ac=audioCtx(); if(!ac)return;
  const start=ac.currentTime+.05;
  const notes=[60,64,67,72,76,79];
  notes.forEach((n,i)=>{
    const dest=ensureBgmGain();
    synthNote(midiToFreq(n),start+i*.11,.18,'square',.045,dest);
  });
}
/* ------------------------------------------------ */

function charDelay(ch){
  if(ch==='\n')return 150;
  if(ch==='。'||ch==='！'||ch==='？')return 260;
  if(ch==='、')return 110;
  if(ch==='…'||ch==='―')return 135;
  if(ch===' ')return 18;
  return 34+Math.floor(Math.random()*12);
}

async function typeText(page){
  typing=true;skip=false;waiting=false;
  els.next.classList.remove('show');
  els.text.textContent='';
  for(let i=0;i<page.text.length;i++){
    if(skip){els.text.textContent=page.text;break}
    const ch=page.text[i];
    els.text.textContent+=ch;
    if(![' ','\n','＊','、','。','！','？','…','―'].includes(ch)&&i%2===0){
      blip(330+(i%5)*22,.02,.014);
    }
    await sleep(charDelay(ch));
  }
  typing=false;
  if(page.eye)eye(page.fanfare?1200:850);
  if(page.fanfare){
    setBgmLevel(bgm.muted?.0001:.22,.08);
    chord();
    setTimeout(()=>setBgmLevel(bgm.muted?.0001:.72,.35),650);
  }
  await sleep(page.after||500);
  waiting=true;
  els.next.classList.add('show');
}

async function showPage(){
  if(idx>=dialoguePages.length){await startBattle();return}
  await typeText(dialoguePages[idx]);
}

async function advance(){
  if(!started||ended)return;
  if(typing){skip=true;return}
  if(!waiting)return;
  idx++;
  await showPage();
}

async function startBattle(){
  waiting=false;
  els.next.classList.remove('show');
  stopBgm(.28);
  els.game.classList.add('hidden');
  els.battle.classList.remove('hidden');
  blip(250,.18,.028);
  await sleep(1850);
  els.flash.classList.add('go');
  chord();
  await sleep(300);
  els.battle.classList.add('hidden');
  els.finale.classList.remove('hidden');
  setTimeout(()=>els.flash.classList.remove('go'),600);
  setTimeout(finaleJingle,180);
  ended=true;
}

async function startShow(){
  if(started)return;
  started=true;ended=false;idx=0;
  els.start.classList.add('hidden');
  els.game.classList.remove('hidden');
  els.musicBtn.classList.remove('hidden');
  const ac=audioCtx();
  try{if(ac&&ac.state==='suspended')await ac.resume()}catch(e){}
  await startBgm();
  await sleep(250);
  await showPage();
}

function reset(){
  stopBgm(.05);
  started=false;ended=false;typing=false;skip=false;waiting=false;idx=0;
  els.text.textContent='';
  els.next.classList.remove('show');
  els.eye.classList.remove('on');
  els.continuePanel.classList.remove('show');
  els.finale.classList.add('hidden');
  els.battle.classList.add('hidden');
  els.game.classList.add('hidden');
  els.musicBtn.classList.add('hidden');
  els.start.classList.remove('hidden');
}

els.startBtn.addEventListener('click',startShow);
els.dialogue.addEventListener('click',advance);
els.stage.addEventListener('click',advance);
els.replayBtn.addEventListener('click',reset);
els.continueBtn.addEventListener('click',()=>{
  els.continuePanel.classList.add('show');
  chord();
});
els.musicBtn.addEventListener('click',toggleBgm);

document.addEventListener('keydown',e=>{
  if(['Enter',' ','z','Z'].includes(e.key)){
    e.preventDefault();
    if(!started)startShow();else advance();
  }
});
updateMusicButton();
</script>
<!-- bgm-release-v1 -->
</body>
</html>
